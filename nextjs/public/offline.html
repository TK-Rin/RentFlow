<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RentFlow is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        color: #1c1917;
        background: #ffffff;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #6b625a;
        line-height: 1.5;
      }
      button {
        height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #ea550b;
        color: #121212;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>RentFlow needs a connection to load your invoices. Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
